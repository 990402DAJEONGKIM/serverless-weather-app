name: Deploy to EC2
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 프로젝트 폴더로 이동
            cd /home/ec2-user/Weather_Project
            
            # 2. 최신 코드 가져오기 (충돌 방지를 위해 현재 변경사항 초기화 옵션 추가 가능)
            git pull origin main
            
            # 3. 만약 Node.js 환경이라면 의존성 설치
            # npm install
            
            # 4. 서버 프로세스 재시작 (PM2 사용 시 가장 권장)
            # --name 뒤에는 pm2 list에 뜨는 앱 이름을 적으세요.
            pm2 reload all || pm2 start server.js --name "weather-app"
            
            # 5. Nginx 설정은 바뀐 게 없다면 재시작 안 해도 되지만, 
            # 확실히 하고 싶다면 아래 명령 추가 (sudo 권한 필요)
            # sudo systemctl reload nginx