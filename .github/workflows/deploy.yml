name: Deploy to EC2

on:
  push:
    branches: [ "main" ] # 배포 대상 브랜치

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          debug: true
          script: |
            # 1. 배포 경로로 이동
            cd /usr/share/nginx/html
            
            # 2. 소유권 강제 변경 (ec2-user가 파일을 덮어쓸 수 있도록 설정)
            # 서버에서 직접 수정한 파일들 때문에 발생하는 권한 충돌을 방지합니다.
            sudo chown -R ec2-user:ec2-user /usr/share/nginx/html
            
            # 3. 모든 브랜치 정보 업데이트 (main 포함)
            git fetch --all
            
            # 4. 강제 동기화 및 브랜치 전환
            # 현재 서버가 master에 있더라도 GitHub의 main 브랜치 상태로 강제 리셋합니다.
            # 이 과정에서 서버의 모든 빨간색(modified) 파일들이 무시되고 최신 코드로 바뀝니다.
            git reset --hard origin/main
            
            # 5. 웹 서버 권한 재설정 (Nginx가 파일을 읽을 수 있도록 설정)
            sudo chmod -R 755 /usr/share/nginx/html
            
            # 확인을 위한 로그 출력
            git status
