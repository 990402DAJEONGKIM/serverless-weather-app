<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Settings - Weather App</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div class="device-wrapper">
        <div class="device-frame">
            <main class="weather-card">
                <div class="settings-container">
                    <header class="card-header">
                        <h1>지역 설정</h1>
                        <p>날씨를 확인할 도시를 선택하세요.</p>
                    </header>

                    <form action="save_settings.php" method="POST" class="city-select-form">
                        <select name="city">
                            <option value="서울">서울특별시</option>
                            <option value="부산">부산광역시</option>
                            <option value="인천">인천광역시</option>
                            <option value="제주">제주특별자치도</option>
                        </select>
                        <button type="submit" class="save-btn">설정 저장</button>
                    </form>
                    
                    <a href="index.html" class="back-link">돌아가기</a>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
