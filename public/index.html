<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Web App</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="device-wrapper">
        <div class="device-frame">
            <a href="settings.php" class="menu-icon">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </a>

            <main class="weather-card">
                <header class="card-header">
                    <h1 id="display-city">오늘의 날씨</h1>
                </header>

                <section class="temp-section">
                    <div class="weather-symbol"></div>
                    <div class="main-temp">
                        <span id="current-temp">0.0</span><span class="unit">°</span>
                    </div>
                </section>

                <section class="status-section">
                    <div class="primary-status">
                        <span id="weather-text">맑음</span>
                        <span id="temp-diff" class="diff-text">어제보다 2°↓</span>
                    </div>
                    <div class="range-status">
                        최저 <span class="low" id="min-temp">-3°</span> 
                        <span class="divider">·</span> 
                        최고 <span class="high" id="max-temp">7°</span>
                    </div>
                </section>

                <footer class="detail-info">
                    <p>습도 <span id="humidity">0</span>% | 풍속 <span id="wind">0</span>m/s</p>
                </footer>
            </main>
        </div>
    </div>

    <script src="./assets/js/script.js"></script>
</body>
</html>
