<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Animated</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Locations</h2>
            <button id="close-btn">&times;</button>
        </div>
        <ul id="location-list"></ul>
    </nav>

    <div class="container">
        <div class="controls">
            <div class="icon-btn menu-btn" id="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="icon-btn unit-btn" id="unit-btn">°F</div>
        </div>

        <header>
            <h1 id="city">Chicago, IL</h1>
            <p id="date">SUNDAY, JANUARY 1, 2017</p>
        </header>

        <main>
            <div class="weather-icon" id="weather-icon-container"></div>
            
            <div class="temperature">
                <span id="temp">72</span><span class="degree-symbol">°</span>
            </div>
            <p id="status">맑음</p>
        </main>
    </div>

    <script src="js/main.js" defer></script>
</body>
</html>
